name: Release a new version

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  release:
    name: Publish to GitHub and Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Parse semver string
        id: semver_parser
        uses: booxmedialtd/ws-action-parse-semver@v1
        with:
          input_string: ${{ github.event.inputs.release_version }}

      - name: Detect pre-release
        run: |
          IS_PRE_RELEASE=${{ steps.semver_parser.outputs.prerelease != '' }}
          echo "IS_PRE_RELEASE=$IS_PRE_RELEASE"
          echo "IS_PRE_RELEASE=$IS_PRE_RELEASE" >> $GITHUB_ENV

      - name: Decrypt and import GPG key
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          echo "$PGP_PRIVATE_KEY" | base64 --decode > private-key.asc
          gpg --batch --import private-key.asc
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d'/' -f2)
          echo "KEY_ID=$KEY_ID" >> $GITHUB_ENV
          rm private-key.asc

      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2
          echo "<settings>
                  <servers>
                    <server>
                      <id>central</id>
                      <username>${{ secrets.OSSRH_USERNAME }}</username>
                      <password>${{ secrets.OSSRH_TOKEN }}</password>
                    </server>
                  </servers>
                  <profiles>
                    <profile>
                      <id>release</id>
                      <properties>
                        <gpg.keyname>${{ env.KEY_ID }}</gpg.keyname>
                        <gpg.passphrase>${{ secrets.PGP_PASSPHRASE }}</gpg.passphrase>
                      </properties>
                    </profile>
                  </profiles>
                </settings>" > ~/.m2/settings.xml

      - name: Set release version
        run: |
          mvn versions:set -DnewVersion=${{ github.event.inputs.release_version }} --batch-mode
          mvn versions:commit --batch-mode

      - name: Maven build
        run: mvn clean package --batch-mode

      - name: Extract artifacts for release
        run: |
          mkdir -p release-artifacts
          cp -v jarplant-cli/target/*-jar-with-dependencies.jar release-artifacts/
          cp -v jarplant-lib/target/*.jar release-artifacts/

      - name: Upload JARs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-modules
          path: release-artifacts/
          if-no-files-found: 'error'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.event.inputs.release_version }}"
          files: release-artifacts/*
          draft: false
          prerelease: ${{ env.IS_PRE_RELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push git tag
        run: |
          git tag v${{ github.event.inputs.release_version }}
          git push --tags

      - name: Deploy  to Maven Central
        run: mvn deploy -Prelease --batch-mode
