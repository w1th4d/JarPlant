name: Release workflow
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetches the whole repo. Required to be able to commit and push later.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Validate that tag is on main branch
        run: |
          TAG_COMMIT=$(git rev-list -n 1 $GITHUB_REF)
          echo "TAG_COMMIT=$TAG_COMMIT"
          
          if git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "✅ Tag commit is on main branch."
          else
            echo "❌ ERROR: Tag does not point to a commit on main. Aborting release."
            exit 1
          fi

      - name: Extract version from tag
        run: |
          RELEASE_VERSION=${GITHUB_REF#refs/tags/v}
          echo "RELEASE_VERSION=$RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Parse semver string
        id: semver_parser
        uses: booxmedialtd/ws-action-parse-semver@v1
        with:
          input_string: ${{ env.RELEASE_VERSION }}

      - name: Validate that POM version matches git tag
        run: |
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          RELEASE_VERSION=${{ steps.semver_parser.outputs.fullversion }}
          echo "POM_VERSION=$POM_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION"
          echo ""
          
          if [[ "$POM_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "❌ ERROR: Version in pom.xml ($POM_VERSION) does not match the tag ($RELEASE_VERSION)."
            exit 1
          fi

          echo "✅ POM version matches tag!"

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Maven build
        run: mvn clean package --batch-mode

      - name: Extract artifacts for release
        run: |
          mkdir -p release-artifacts
          cp -v jarplant-cli/target/*-jar-with-dependencies.jar release-artifacts/
          cp -v jarplant-lib/target/*.jar release-artifacts/

      - name: Upload JARs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-modules
          path: release-artifacts/

      - name: Check if tag is at HEAD of main
        run: |
          TAG_COMMIT=$(git rev-list -n 1 $GITHUB_REF)
          MAIN_HEAD=$(git rev-parse origin/main)

          if [[ "$TAG_COMMIT" == "$MAIN_HEAD" ]]; then
            echo "✅ Tag is at HEAD of main."
            echo "TAG_AT_HEAD=true" >> $GITHUB_ENV
          else
            echo "⚠️ Tag is not at HEAD of main. Skipping POM version bump."
            echo "TAG_AT_HEAD=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          files: release-artifacts/*
          draft: false
          prerelease: ${{ steps.semver_parser.outputs.prerelease != '' }}
          make_latest: ${{ env.TAG_AT_HEAD == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set next snapshot version
        if: env.TAG_AT_HEAD == 'true'
        run: |
          NEXT_PATCH=$(( ${{ steps.semver_parser.outputs.patch }} + 1 ))
          NEXT_VERSION="${{ steps.semver_parser.outputs.major }}.${{ steps.semver_parser.outputs.minor }}.${NEXT_PATCH}-SNAPSHOT"

          echo "🔄 Bumping version to: $NEXT_VERSION"
          mvn versions:set -DnewVersion=$NEXT_VERSION -DgenerateBackupPoms=false --batch-mode

      - name: Commit updated POM to repository
        if: env.TAG_AT_HEAD == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push
          git checkout main
          git stash pop --quiet
          git add --verbose .
          git status
          git commit -m "Preparing next snapshot"
          git push
